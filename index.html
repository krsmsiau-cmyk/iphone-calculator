<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101114"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="我的計算機">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>我的計算機</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#101114;color:white;min-height:100dvh;display:flex;align-items:center;justify-content:center}.app{width:min(100%,440px);padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px)}.heading{font-size:15px;color:#9da0aa;letter-spacing:.05em;margin-bottom:22px}.screen{height:170px;display:flex;flex-direction:column;justify-content:end;align-items:flex-end;overflow:hidden;padding:10px 4px 20px}.history{height:24px;color:#a5a6ae;font-size:18px}.display{font-size:clamp(46px,12vw,68px);font-weight:300;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}button{border:0;min-height:70px;aspect-ratio:1;border-radius:50%;font-size:29px;color:white;background:#2d2f35;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{filter:brightness(1.3);transform:scale(.97)}.utility{background:#5c606a}.operator{background:#f5a524;color:#111}.equals{background:#f5a524;color:#111}.zero{grid-column:span 2;aspect-ratio:auto;border-radius:50px;text-align:left;padding-left:30px}.foot{text-align:center;color:#777b84;font-size:12px;margin-top:24px}@media(max-height:720px){.screen{height:125px}.heading{margin-bottom:8px}button{min-height:58px}.keys{gap:9px}}
</style>
</head>
<body><main class="app"><div class="heading">我的計算機</div><div class="screen" aria-live="polite"><div class="history" id="history"></div><div class="display" id="display">0</div></div><div class="keys" id="keys">
<button class="utility" data-key="AC">AC</button><button class="utility" data-key="sign">±</button><button class="utility" data-key="percent">%</button><button class="operator" data-key="/">÷</button>
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="operator" data-key="*">×</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="operator" data-key="-">−</button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="operator" data-key="+">+</button>
<button class="zero" data-key="0">0</button><button data-key=".">.</button><button class="equals" data-key="=">=</button>
</div><div class="foot">離線也能使用 · 鍵盤支援 Backspace 刪除</div></main>
<script>
(()=>{'use strict';let current='0',previous=null,operator=null,replace=false,history='';const display=document.getElementById('display'),hist=document.getElementById('history');const symbols={'+':'+','-':'−','*':'×','/':'÷'};function fmt(v){if(!Number.isFinite(v))return '錯誤';return String(Number(v.toPrecision(12)))}function show(){display.textContent=current;hist.textContent=history}function clear(){current='0';previous=null;operator=null;replace=false;history=''}function calculate(a,b,op){switch(op){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '/':return b===0?NaN:a/b;default:return b}}function act(key){if(current==='錯誤'&&!['AC'].includes(key))clear();if(/^\d$/.test(key)){if(replace){current=key;replace=false}else if(current==='0'){current=key}else if(current==='-0'){current='-'+key}else if(current.replace(/[-.]/g,'').length<12){current+=key}}else if(key==='.'){if(replace){current='0.';replace=false}else if(!current.includes('.'))current+='.'}else if(key==='AC'){clear()}else if(key==='sign'){if(current!=='0')current=current.startsWith('-')?current.slice(1):'-'+current}else if(key==='percent'){current=fmt(Number(current)/100)}else if(key==='back'){if(replace){current='0';replace=false}else current=current.length<=1||current.length===2&&current.startsWith('-')?'0':current.slice(0,-1)}else if(['+','-','*','/'].includes(key)){if(operator!==null&&previous!==null&&!replace){current=fmt(calculate(previous,Number(current),operator));if(current==='錯誤'){previous=null;operator=null;history='';show();return}}previous=Number(current);operator=key;replace=true;history=current+' '+symbols[key]}else if(key==='='){if(operator!==null&&previous!==null){const right=Number(current);history=fmt(previous)+' '+symbols[operator]+' '+current+' =';current=fmt(calculate(previous,right,operator));previous=null;operator=null;replace=true}}show()}document.getElementById('keys').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)act(b.dataset.key)});document.addEventListener('keydown',e=>{const map={Enter:'=',Escape:'AC',Backspace:'back',x:'*',X:'*'};const key=map[e.key]||e.key;if(/^\d$/.test(key)||['.','+','-','*','/','=','AC','back'].includes(key)){e.preventDefault();act(key)}});show();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
